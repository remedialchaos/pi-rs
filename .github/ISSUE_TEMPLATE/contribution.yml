name: Proposal
description: Propose a change, architecture update, or milestone task for pi-rs
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Check [rust/DECISIONS.md](https://github.com/remedialchaos/pi-rs/blob/main/rust/DECISIONS.md) and [rust/MAP.md](https://github.com/remedialchaos/pi-rs/blob/main/rust/MAP.md) first.

  - type: textarea
    id: what
    attributes:
      label: What do you want to change?
      description: Be specific and concise.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: How? (optional)
      description: Brief technical approach if you have one in mind.
    validations:
      required: false
