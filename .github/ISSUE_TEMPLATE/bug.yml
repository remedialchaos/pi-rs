name: Bug Report
description: Report a bug or parity mismatch in pi-rs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/remedialchaos/pi-rs/blob/main/CONTRIBUTING.md) before opening an issue.
        Keep reports concise and include minimal reproduction steps.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug or behavioral mismatch against upstream pi. Include error messages if any.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal commands, inputs, or unit/case names to trigger the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Commit / Target
      description: e.g. commit SHA, Linux x86_64, rustc version
    validations:
      required: false
