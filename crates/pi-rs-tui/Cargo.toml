[package]
name = "pi-rs-tui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Terminal user interface components with differential rendering, ported from @earendil-works/pi-tui"
license = "MIT"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
emojis = "0.9"
icu_collator = "~2.2.0"
icu_segmenter = "~2.2.0"
indexmap = "2"
libc = "0.2"
libm = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
vt100 = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "termios"] }

[target.'cfg(windows)'.dependencies]
crossterm = "0.29"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }
