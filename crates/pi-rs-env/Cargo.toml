[package]
name = "pi-rs-env"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Remote execution environment daemon and client transport (Rust port of packages/env)"

[[bin]]
name = "pi-env"
path = "src/bin/pi_env.rs"

[features]
default = ["client"]
client = [
    "dep:async-trait",
    "dep:pi-rs-chord",
    "dep:pi-rs-durable",
    "dep:uuid",
    "dep:url",
    "dep:percent-encoding",
    "dep:base64",
    "dep:rand",
    "dep:serde",
    "dep:thiserror",
    "dep:tokio",
]

[dependencies]
async-trait = { version = "0.1", optional = true }
pi-rs-chord = { path = "../pi-rs-chord", optional = true }
pi-rs-durable = { path = "../pi-rs-durable", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
url = { version = "2", optional = true }
percent-encoding = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
encoding_rs = "0.8"
ignore = "0.4"
notify = "9"
rand = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
