[package]
name = "pi-rs-agent"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Conversation lifecycle and tool orchestration for pi-rs"

[dependencies]
pi-rs-ai = { path = "../pi-rs-ai" }
pi-rs-schema = { path = "../pi-rs-schema" }
futures-util = "0.3"
indexmap = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["test-util", "net"] }
