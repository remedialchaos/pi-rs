[package]
name = "pi-rs-p2-web"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Leptos CSR WASM browser frontend for p2 (ADR-011, Rust port of apps/p2/src/web)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
leptos = { version = "0.8", features = ["csr"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "BinaryType",
    "Clipboard",
    "CssStyleDeclaration",
    "CustomEvent",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "History",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "ResizeObserver",
    "Storage",
    "WebSocket",
    "Window",
] }
