[package]
name = "pi-rs-env"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Remote execution environment daemon and client transport (Rust port of packages/env)"

[[bin]]
name = "pi-env"
path = "src/bin/pi_env.rs"

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
ignore = "0.4"
notify = "9"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
