[package]
name = "pi-rs-p2"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "p2"
path = "src/main.rs"

[dependencies]
form_urlencoded = "1"
hmac = "0.12"
http = "1"
axum = { version = "0.8" }
indexmap = { version = "2", features = ["serde"] }
sha2 = "0.10"
pi-rs-chord = { path = "../pi-rs-chord" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"
tempfile = "3"
