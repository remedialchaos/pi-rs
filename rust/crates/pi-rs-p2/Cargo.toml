[package]
name = "pi-rs-p2"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "p2"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
form_urlencoded = "1"
hmac = "0.12"
http = "1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
axum = { version = "0.8" }
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2"
regex = "1"
url = "2"
sha2 = "0.10"
pi-rs-ai = { path = "../pi-rs-ai" }
pi-rs-chord = { path = "../pi-rs-chord" }
pi-rs-durable = { path = "../pi-rs-durable" }
pi-rs-env = { path = "../pi-rs-env" }
pi-rs-p2-tui = { path = "../pi-rs-p2-tui" }
pi-rs-tui = { path = "../pi-rs-tui" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
# Remote TUI connections use TLS through Chord's WebSocket transport.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["hostname"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
futures-util = "0.3"
