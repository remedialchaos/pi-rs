[package]
name = "pi-rs-coding-agent"
version = "0.1.0"
edition = "2024"
publish = false
description = "Coding agent runtime, modes, and pi CLI (Rust port of packages/coding-agent)"

[[bin]]
name = "pi"
path = "src/main.rs"

[dependencies]
pi-rs-schema = { path = "../pi-rs-schema" }
pi-rs-telemetry = { path = "../pi-rs-telemetry" }
pi-rs-mcp = { path = "../pi-rs-mcp" }
pi-rs-codemode = { path = "../pi-rs-codemode" }
pi-rs-tui = { path = "../pi-rs-tui" }
pi-rs-ai = { path = "../pi-rs-ai" }
pi-rs-agent = { path = "../pi-rs-agent" }
wasmtime = { version = "=50.0.2", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "async"] }

async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
futures-util = "0.3"
fancy-regex = "0.14"
globset = "0.4"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
indexmap = { version = "2", features = ["serde"] }
node-semver = "2"
nix = { version = "0.29", features = ["signal", "process", "user"] }
notify = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
saphyr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
sha2 = "0.10"
similar = { version = "3", features = ["inline"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
