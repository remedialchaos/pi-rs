[request]
method = "GET"
path = "/manifest.webmanifest"

[response]
status = 200

[response.headers]
cache-control = "public, max-age=86400"
content-security-policy = "default-src 'none'; script-src 'self' 'nonce-[..]-[..]-[..]-[..]-[..]' 'wasm-unsafe-eval'; connect-src 'self' ws://127.0.0.1:[..]; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
content-type = "application/manifest+json"
referrer-policy = "no-referrer"
x-content-type-options = "nosniff"
x-frame-options = "DENY"
